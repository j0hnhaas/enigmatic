<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Enigma Simulator</title>
  <meta name="description" content="Simulator of the historic Enigma cipher machines: Enigma I, M3, M4, D, K, G, T, Railway and Norenigma.">
  <meta name="theme-color" content="#1a1712">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Texts carry data-i18n keys (see js/i18n.js); the English text here is only a fallback. -->
  <header class="topbar">
    <div class="brand" data-i18n="brand">Cipher Machine</div>
    <label class="model-pick">
      <span class="sr" data-i18n="model">Model</span>
      <select id="model"></select>
    </label>
    <div class="top-actions">
      <button id="btn-settings" class="btn" data-i18n-title="settingsTitle"><span aria-hidden="true">⚙</span> <span class="btn-label" data-i18n="settings">Key</span></button>
      <button id="btn-see" class="btn" aria-pressed="false" data-i18n-title="seeThroughTitle"><span aria-hidden="true">◐</span> <span class="btn-label" data-i18n="seeThrough">See-through</span></button>
      <button id="btn-info" class="btn" data-i18n-title="aboutModel" data-i18n-aria="aboutModel">ⓘ</button>
      <label class="btn lang-pick" data-i18n-title="language">
        <span class="lang-full" id="lang-full"></span><span class="lang-code" id="lang-code"></span><span class="caret" aria-hidden="true">▾</span>
        <select id="lang" data-i18n-aria="language"></select>
      </label>
      <button id="btn-install" class="btn" hidden data-i18n="install">Install</button>
    </div>
  </header>

  <main class="layout">
    <section class="machine" data-i18n-aria="machineAria">
      <div class="box">
        <div class="panel">
          <div class="panel-top">
            <div class="nameplate"><span>ENIGMA</span></div>
            <div class="rotor-cover" id="rotors" data-i18n-aria="rotorsAria"></div>
            <div class="model-tag" id="model-tag"></div>
          </div>
          <div class="seethrough" id="seethrough" hidden></div>
          <div class="lampboard" id="lamps" aria-live="polite"></div>
          <div class="keyboard" id="keys"></div>
        </div>
        <div class="frontplate" id="frontplate">
          <div class="plug-title" data-i18n="plugboard">Plugboard</div>
          <div class="plugboard" id="plugboard">
            <svg class="cables" id="cables" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
    </section>

    <aside class="desk">
      <div class="paper">
        <div class="paper-head">
          <span data-i18n="message">Message</span>
          <span id="counter"></span>
        </div>
        <div class="tape"><label data-i18n="tapeIn">Plaintext / input</label><div id="tape-in" class="tape-text"></div></div>
        <div class="tape"><label data-i18n="tapeOut">Output (lamps)</label><div id="tape-out" class="tape-text out"></div></div>
        <div class="paper-actions">
          <button class="btn small" id="btn-undo" data-i18n="undo" data-i18n-title="undoTitle">↶ Undo</button>
          <button class="btn small" id="btn-copy" data-i18n="copy">Copy</button>
          <button class="btn small" id="btn-clear" data-i18n="clear">New sheet</button>
        </div>
      </div>

      <details class="paper bulk">
        <summary data-i18n="bulkSummary">Paste text and run it through</summary>
        <textarea id="bulk-text" rows="4" data-i18n-placeholder="bulkPlaceholder"></textarea>
        <button class="btn" id="btn-bulk" data-i18n="bulkRun">Run through the machine</button>
      </details>

      <details class="paper trace-box" open>
        <summary data-i18n="traceSummary">Current path of the last letter</summary>
        <div id="trace" class="trace"></div>
      </details>
    </aside>
  </main>

  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-inner" id="settings-form">
      <h2 data-i18n="dailyKey">Daily key</h2>
      <div id="settings-body"></div>
      <h3 data-i18n="historic">Historic messages</h3>
      <div id="presets" class="presets"></div>
      <h3 data-i18n="options">Options</h3>
      <label class="check"><input type="checkbox" id="opt-sound"> <span data-i18n="optSound">Key sound</span></label>
      <label class="check"><input type="checkbox" id="opt-groups"> <span data-i18n="optGroups">Output in groups of five</span></label>
      <div class="sheet-actions">
        <button class="btn" value="close" data-i18n="done">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="info" class="sheet">
    <form method="dialog" class="sheet-inner">
      <h2 id="info-title"></h2>
      <p class="info-meta" id="info-meta"></p>
      <p id="info-text"></p>
      <h3 data-i18n="operation">How to use</h3>
      <ul class="help">
        <li data-i18n="help1"></li>
        <li data-i18n="help2"></li>
        <li data-i18n="help3"></li>
        <li data-i18n="help4"></li>
      </ul>
      <p class="copyright">© 2026 Johnny Haas · <a href="https://github.com/j0hnhaas/enigmatic" target="_blank" rel="noopener" data-i18n="sourceCode">Source code on GitHub</a> · <span data-i18n="mitLicense">MIT License</span><br><span data-i18n="dataSources"></span></p>
      <div class="sheet-actions"><button class="btn" value="close" data-i18n="close">Close</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/i18n.js"></script>
  <script src="js/machines.js"></script>
  <script src="js/enigma.js"></script>
  <script src="js/seethrough.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
